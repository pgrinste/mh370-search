[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mh370-search"
version = "0.2.0"
description = "Probabilistic search for Flight MH370 from public data: seventh-arc geometry, BFO consistency, and debris drift."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
viz = ["folium>=0.15"]   # interactive HTML map (python -m mh370.interactive_map)

[tool.setuptools.packages.find]
where = ["src"]
